[project]
name = "guild-rebrew"
version = "1.2.0"
description = "Europa 1400 (The Guild) decompilation project: byte-identical C89 source reconstruction"
requires-python = ">=3.13"
dependencies = [
    "angr>=9.2.204",
    "pyunicorn>=0.9.0",
    "rebrew",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.3",
    "black>=24.0",
    "isort>=5.13",
    "pytest>=8.0",
]

[tool.uv]
package = false
# The 1.11 abi3 wheel contains a CPython 3.10-only compressor extension.
# Build the locked source for our interpreter so angr's loader can import it.
no-binary-package = ["uefi-firmware"]
# angr (<=9.3.1) pins capstone==5.0.6, which conflicts with rebrew's
# capstone>=5.0.8 (PYSEC-2026-3544 advisory fix).  capstone 5.0.9 is
# backward-compatible with angr's usage, so force the newer version.
override-dependencies = ["capstone>=5.0.8"]

[tool.uv.sources]
rebrew = { path = "../relumea/repos/rebrew", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[dependency-groups]
dev = [
    "angr>=9.2.204",
]
