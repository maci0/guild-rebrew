[project]
name = "guild-rebrew"
version = "1.3.0"
description = "Europa 1400 (The Guild) decompilation project: byte-identical C89 source reconstruction"
requires-python = ">=3.13"
dependencies = [
    "rebrew[prove]==5.2.0",
]

[project.optional-dependencies]
dashboard = ["recoverage==8.2.0"]
binsync = ["rebrew[binsync]==5.2.0"]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
# The project supplies Rebrew 5.2; ignore only Recoverage 8.2's embedded 5.1 URL.
exclude-dependencies = [
    { package = { name = "recoverage", version = "8.2.0" }, dependencies = ["rebrew"] },
]

[tool.uv.sources]
rebrew = { url = "https://github.com/maci0/rebrew/releases/download/v5.2.0/rebrew-5.2.0-py3-none-any.whl" }
recoverage = { url = "https://github.com/maci0/recoverage/releases/download/v8.2.0/recoverage-8.2.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
target-version = ["py313"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
