[project]
name = "guild-rebrew"
version = "0.1.0"
description = "Europa 1400 (The Guild) decompilation project — byte-identical C89 source reconstruction"
requires-python = ">=3.12"
dependencies = [
    "angr>=9.2.204",
    "pyunicorn>=0.9.0",
    "reccmp>=0.1.1",
    "rebrew",
    "recoverage",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "ruff>=0.3",
    "black>=24.0",
    "isort>=5.13",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
rebrew = { path = "../rebrew", editable = true }
recoverage = { path = "../recoverage", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
