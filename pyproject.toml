[project]
name = "guild-rebrew"
version = "1.5.0"
description = "Europa 1400 (The Guild) decompilation project: byte-identical C89 source reconstruction"
requires-python = ">=3.14"
dependencies = [
    "rebrew[prove]==6.2.0",
]

[project.optional-dependencies]
dashboard = [
    "recoverage==8.5.0",
]
binsync = [
    "rebrew[binsync]==6.2.0",
]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
[tool.uv.sources]
rebrew = { url = "https://github.com/maci0/rebrew/releases/download/v6.2.0/rebrew-6.2.0-py3-none-any.whl" }
recoverage = { url = "https://github.com/maci0/recoverage/releases/download/v8.5.0/recoverage-8.5.0-py3-none-any.whl" }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
target-version = ["py314"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
