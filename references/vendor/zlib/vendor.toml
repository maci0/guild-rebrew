# zlib 1.1.3: the release tarball unpacked into `pristine`, plus local patches.
# rebrew library vendor --apply rebuilds `output` from them; CMake runs its check at configure.
# Provenance, patch reasons and the update procedure: docs/vendoring.md.
name = "zlib"
