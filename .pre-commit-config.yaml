repos:
-   repo: local
    hooks:
    -   id: clang-format
        name: clang-format
        entry: clang-format -i --style=file
        language: system
        types: [c]

    -   id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        types: [c]
        args: ['--config-file=.clang-tidy']

    # Catches reversing work that duplicates a linked library. Byte-level, so
    # it does not depend on function names matching. Skipped automatically
    # when the reference library has not been extracted (exit 2).
    -   id: no-library-code
        name: no reversed library code
        entry: python3 scripts/check_library_code.py
        language: system
        pass_filenames: false
        files: '^src/.*\.c$'
