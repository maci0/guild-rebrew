repos:
-   repo: local
    hooks:
    -   id: clang-format
        name: clang-format
        entry: clang-format -i --style=file
        language: system
        types: [c]

    -   id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        types: [c]
        args: ['--config-file=.clang-tidy']

    # Catches reversing work that duplicates a linked library. Byte-level, so
    # it does not depend on function names matching. The stock archive is
    # extracted from the toolchain image; the hook skips itself when the
    # container runtime is unavailable.
    -   id: no-library-code
        name: no reversed library code
        entry: rebrew library match --stock-lib LIBCMT.LIB
        language: system
        pass_filenames: false
        files: '^src/.*\.c$'
