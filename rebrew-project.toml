# External .lib code ("not our work"): identified library modules leave the
# progress accounting, `rebrew lib-match` ingests the archives by default,
# and `rebrew cmake-sources` emits the non-empty specs as
# REBREW_EXTERNAL_LIBS — link order is this order (static archives last).
[targets."server.dll".external_libs]
KERNEL32 = "KERNEL32.lib"
USER32 = "USER32.lib"
WS2_32 = "WS2_32.lib"
WINMM = "WINMM.lib"
MSVCRT = ""
LIBCMT = "LIBCMT.lib"

[targets."Europa1400Gold_TL.exe"]
# Same compiler VERSION as the server (cl 12.00.8804), different CODE
# GENERATOR: both clients carry the Processor Pack's `@comp.id` record
# (0x00302354 = c2 13.00.9044) in their Rich headers, and their .text emits
# `test ah,0x44`/`test ah,0x05` (1011 sites in GOLDTL) which no plain VC6
# generator emits under any flag set. Server.dll has zero of those sites and
# carries no Rich header; its FP-compare functions reproduce byte-exactly only
# under the plain generators. Definitive measurements and the 3-way matrix:
# docs/general-knowledge.md, "one compiler version, two code generators".
compiler = { profile = "msvc-6.0-sp5-pp" }
# The T&L client statically links d3dx8.lib: 0x5e0000-0x64ffff holds ~907
# linker-supplied D3DX8 bodies (~273 KB), not game source.  Declared so
# "work left" tools (cross-import, todo) skip the band instead of treating it
# as unreversed game code.  GOLD links DirectX by DLL import only.
external_ranges = ["0x5e0000-0x64ffff"]
binary = "original/Europa1400Gold_TL.exe"
format = "pe"
arch = "x86_32"
reversed_dir = "src"
inventory_file = "db/inventory-Europa1400Gold_TL.exe.json"
bin_dir = "bin/Europa1400Gold_TL.exe"
source_ext = ".c"
origins = ["GAME"]
marker = "GOLDTL"
# Provisional link list — measured import/static names for the identified
# external modules; adjust when the TL link lands (REBREW_EXTERNAL_LIBS).
[targets."Europa1400Gold_TL.exe".external_libs]
KERNEL32 = "KERNEL32.lib"
USER32 = "USER32.lib"
DDRAW = "DDRAW.lib"
DINPUT = "DINPUT.lib"
OLE32 = "OLE32.lib"
CTLFWR32 = "CTLFWR32.lib"
LUA50 = "LUA50.lib"
MSS32 = "MSS32.lib"
MSVCRT = ""
D3DX8 = "references/dxsdk8/lib/d3dx8.lib"
LIBCMT = "LIBCMT.lib"

[targets."Europa1400Gold.exe"]
# Client (non-TL) build of the same game. Shares game logic with server.dll
# (DieGildeAddOn) and the TL client; client-only units (ch_, ai_, he_, d2_,
# d3_, nt_, ob_, gs_, am_) are out of scope for server symbols but in scope
# here. Marker GOLD distinguishes its annotations from SERVER/GOLDTL.
marker = "GOLD"
# Same client compiler as the TL build (see that target's note above).
compiler = { profile = "msvc-6.0-sp5-pp" }
binary = "original/Europa1400Gold.exe"
format = "pe"
arch = "x86_32"
reversed_dir = "src"
inventory_file = "db/inventory-Europa1400Gold.exe.json"
bin_dir = "bin/Europa1400Gold.exe"
source_ext = ".c"
origins = ["GAME"]
# Provisional link list — identified external modules; adjust when the
# GOLD link lands (REBREW_EXTERNAL_LIBS).
[targets."Europa1400Gold.exe".external_libs]
KERNEL32 = "KERNEL32.lib"
USER32 = "USER32.lib"
DDRAW = "DDRAW.lib"
DINPUT = "DINPUT.lib"
OLE32 = "OLE32.lib"
CTLFWR32 = "CTLFWR32.lib"
MSS32 = "MSS32.lib"
MSVCRT = ""
LIBCMT = "LIBCMT.lib"
[compiler]
profile = "msvc-6.0-sp6"
# Docker-only toolchain: CL.EXE runs inside rebrew/msvc:6.0-win32 (the
# standard rebrew runner); no host toolchain tree, so these legacy fields
# are empty.
command = ""
includes = "src/Develop"
libs = ""
cflags = "/O2 /Gd"
base_cflags = "/nologo /c /MT /D \"_WIN32_WINNT=0x0400\" /Ireferences/zlib-1.1.3"
timeout = 60

[compiler.cflags_presets]
MSVCRT = "/O1"
ZLIB = "/O2"

[targets."server.dll".crt_sources]
MSVCRT = ""
