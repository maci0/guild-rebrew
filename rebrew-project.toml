[project]
name = "Europa 1400: The Guild"
jobs = 8
db_dir = "db"
output_dir = "output"

[targets."server.dll"]
binary = "original/Server/server.dll"
format = "pe"
arch = "x86_32"
marker = "SERVER"
reversed_dir = "src/server.dll"
function_list = "src/server.dll/functions.txt"
bin_dir = "bin/server.dll"
origins = ["GAME", "ZLIB", "MSVCRT"]
game_range_end = 0x10019000
iat_thunks = [
    0x1001A160, 0x1001A166, 0x1001A16C, 0x1001A172,
    0x1001A178, 0x1001A17E, 0x1001A184, 0x10023840,
]
dll_exports = { 0x10009320 = "Init", 0x10009350 = "Exit" }
zlib_vas = [
    0x10001000, 0x10001330, 0x10001530, 0x10001860, 0x10001890,
    0x100057C0, 0x100058D0, 0x10004BC0, 0x10005390, 0x100015B0,
    0x10005D00, 0x10005DB0, 0x10006280, 0x10006EC0, 0x10006FB0,
    0x10007050,     0x100092E0, 0x10009300,
    0x10003960,
]

[targets."server.dll".cflags_presets]
ZLIB = "/O3"
NEW_PRESET = "/O0"

[compiler]
profile = "msvc6"
command = "wine tools/MSVC600/VC98/Bin/CL.EXE"
includes = "tools/MSVC600/VC98/Include"
libs = "tools/MSVC600/VC98/Lib"
cflags = "/O2 /Gd"
base_cflags = "/nologo /c /MT"
timeout = 60

[compiler.cflags_presets]
GAME = "/O2 /Gd"
MSVCRT = "/O1"
ZLIB = "/O2"

[targets."server.dll".crt_sources]
MSVCRT = "tools/MSVC600/VC98/CRT/SRC"