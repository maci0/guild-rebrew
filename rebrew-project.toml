[project]
name = "Europa 1400: The Guild"
jobs = 8
default_target = "Europa1400Gold_TL.exe"
# Unified source tree: src/Develop mirrors D:\Develop. Every target scans
# the whole tree; dedicated MODULE.0xVA metadata rows select each target's
# definitions (rebrew ADR-030). Divergent twins sit side by side as
# GOLDTL.<name>.c / GOLD.<name>.c (module-first, like metadata keys) until
# ported to #ifdef or stacked ADDRESS anchors. Progress commands (status/todo)
# scope to the active target's own module; library headers land in every
# target's scan but count for none.
shared_dir = "src"

[targets."server.dll"]
check_known_bindings = true
# Temporary historical layout; remove the second define to compile the reconstructed variant.
defines = ["REBREW_SERVER", "REBREW_LEGACY_SERVER_LAYOUT"]
# Code generator lock (round 1379): the server's x87 compares are the PLAIN
# VC6 idiom (`fnstsw ax; test ah,0x40/0x01`, 10 sites in game code, 0
# Processor-Pack sites binary-wide). `rebrew toolchain detect
# original/Server/server.dll --target server.dll` verifies this and refuses a `-pp` profile; scripts/gate.sh runs
# it. Plain SP5 and SP6 output is byte-identical for all 262 reversed functions.
# SP5 is pinned because its stock CRT formatter matches the reference;
# SP6 adds 93 bytes to that library function.
compiler = { profile = "msvc-6.0-sp5" }
ghidra_program_path = "/server.dll"
# Shared BinSync state dir: `functions/*.toml`, `global_vars.toml`,
# `structs/*.toml`, writable 0644 for the BinSync client.  Configured here so `rebrew sync` and
# `rebrew doctor` find it without `--state-dir` on every invocation.  The
# directory itself stays gitignored -- it is regenerable with
# `rebrew sync push` -- while this pointer is versioned.
binsync_state_dir = "binsync"
binary = "original/Server/server.dll"
# Whole-file status scores the raw toolchain output.
raw_link = "build/server.dll"
format = "pe"
arch = "x86_32"
module = "SERVER"
reversed_dir = "src"
inventory_file = "db/inventory-server.dll.json"
bin_dir = "bin/server.dll"
iat_thunks = [
    0x1001A160, 0x1001A166, 0x1001A16C, 0x1001A172,
    0x1001A178, 0x1001A17E, 0x1001A184, 0x10023840,
]
dll_exports = { 0x10009320 = "Init", 0x10009350 = "Exit" }

# External .lib code ("not our work"): identified library modules leave the
# progress accounting, `rebrew library match` ingests the archives by default,
# and `rebrew build cmake-sources` emits the non-empty specs as
# REBREW_EXTERNAL_LIBS — link order is this order (static archives last).
[targets."server.dll".external_libs]
KERNEL32 = "KERNEL32.lib"
USER32 = "USER32.lib"
WS2_32 = "WS2_32.lib"
LIBCMT = "LIBCMT.lib"
WINMM = "WINMM.lib"
MSVCRT = ""


[targets."Europa1400Gold_TL.exe"]
check_known_bindings = true
# Code generator lock (round 1379): same compiler VERSION as the server
# (cl 12.00.8804), different CODE GENERATOR.  Game code only (the D3DX8 band is
# excluded via external_ranges below): 832 Processor-Pack x87 compares
# (`fnstsw ax; test ah,0x44/0x05`) against 0 plain ones, and the functions that
# do carry a compare reproduce byte-exactly only under this profile.
# `rebrew toolchain detect original/Europa1400Gold_TL.exe
# --target Europa1400Gold_TL.exe` enforces it;
# scripts/gate.sh runs it.  Measurements: docs/general-knowledge.md,
# "one compiler version, two code generators".
compiler = { profile = "msvc-6.0-sp5-pp" }
# The T&L client statically links d3dx8.lib: 0x5e0000-0x64ffff holds ~907
# linker-supplied D3DX8 bodies (~273 KB), not game source.  Declared so
# "work left" tools (cross-import, todo) skip the band instead of treating it
# as unreversed game code.  GOLD links DirectX by DLL import only.
external_ranges = ["0x5e0000-0x64ffff"]
binary = "original/Europa1400Gold_TL.exe"
format = "pe"
arch = "x86_32"
reversed_dir = "src"
inventory_file = "db/inventory-Europa1400Gold_TL.exe.json"
bin_dir = "bin/Europa1400Gold_TL.exe"
module = "GOLDTL"
# Provisional link list — measured import/static names for the identified
# external modules; adjust when the TL link lands (REBREW_EXTERNAL_LIBS).
[targets."Europa1400Gold_TL.exe".external_libs]
KERNEL32 = "KERNEL32.lib"
USER32 = "USER32.lib"
DDRAW = "DDRAW.lib"
DINPUT = "DINPUT.lib"
OLE32 = "OLE32.lib"
CTLFWR32 = "CTLFWR32.lib"
LUA50 = "LUA50.lib"
MSS32 = "MSS32.lib"
MSVCRT = ""
D3DX8 = "references/dxsdk8/lib/d3dx8.lib"
LIBCMT = "LIBCMT.lib"
WINMM = "WINMM.lib"

[targets."Europa1400Gold.exe"]
check_known_bindings = true
defines = ["REBREW_GOLD"]
# Client (non-TL) build of the same game. Shares game logic with server.dll
# (DieGildeAddOn) and the TL client; client-only units (ch_, ai_, he_, d2_,
# d3_, nt_, ob_, gs_, am_) are out of scope for server symbols but in scope
# here. Marker GOLD distinguishes its annotations from SERVER/GOLDTL.
module = "GOLD"
# Same code generator as TL; native CRT entry points and gzip errno access
# identify the single-thread runtime. Keep this override local to Gold.
compiler = { profile = "msvc-6.0-sp5-pp", base_cflags = '/nologo /c /ML /D "_WIN32_WINNT=0x0400" /Ireferences/zlib-1.1.3' }
binary = "original/Europa1400Gold.exe"
format = "pe"
arch = "x86_32"
reversed_dir = "src"
inventory_file = "db/inventory-Europa1400Gold.exe.json"
bin_dir = "bin/Europa1400Gold.exe"
# Provisional link list — identified external modules; adjust when the
# GOLD link lands (REBREW_EXTERNAL_LIBS).
[targets."Europa1400Gold.exe".external_libs]
KERNEL32 = "KERNEL32.lib"
USER32 = "USER32.lib"
DDRAW = "DDRAW.lib"
DINPUT = "DINPUT.lib"
OLE32 = "OLE32.lib"
CTLFWR32 = "CTLFWR32.lib"
MSS32 = "MSS32.lib"
MSVCRT = ""
LIBC = "LIBC.lib"
WINMM = "WINMM.lib"
[compiler]
profile = "msvc-6.0-sp5"
# Docker-only toolchain: CL.EXE runs inside rebrew/msvc:6.0-sp5-win32 (the
# standard rebrew runner); no host toolchain tree, so these legacy fields
# are empty.
command = ""
includes = "src/Develop"
libs = ""
cflags = "/O2 /Gd"
base_cflags = "/nologo /c /MT /D \"_WIN32_WINNT=0x0400\" /Ireferences/zlib-1.1.3"
