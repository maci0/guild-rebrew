[project]
name = "Europa 1400: The Guild"
jobs = 8
db_dir = "db"
output_dir = "output"
default_target = "server.dll"
# Unified source tree: src/Develop mirrors D:\Develop. Every target scans
# the whole tree; one // FUNCTION: <marker> <va> block per target selects
# each binary's code (rebrew ADR-022). Divergent twins sit side by side as
# GOLDTL.<name>.c / GOLD.<name>.c (module-first, like metadata keys) until
# ported to #ifdef or stacked markers. Progress commands (status/todo)
# scope to the active target's own module; library headers land in every
# target's scan but count for none.
shared_dir = "src"

[targets."server.dll"]
ghidra_program_path = "/server.dll"
# Shared BinSync state dir: `functions/*.toml`, `global_vars.toml`,
# `structs/*.toml`, write-locked 0444.  Configured here so `rebrew sync` and
# `rebrew doctor` find it without `--state-dir` on every invocation.  The
# directory itself stays gitignored -- it is regenerable with
# `rebrew sync --push` -- while this pointer is versioned.
binsync_state_dir = "binsync"
binary = "original/Server/server.dll"
format = "pe"
arch = "x86_32"
marker = "SERVER"
reversed_dir = "src"
inventory_file = "db/inventory-server.dll.json"
bin_dir = "bin/server.dll"
iat_thunks = [
    0x1001A160, 0x1001A166, 0x1001A16C, 0x1001A172,
    0x1001A178, 0x1001A17E, 0x1001A184, 0x10023840,
]
dll_exports = { 0x10009320 = "Init", 0x10009350 = "Exit" }
